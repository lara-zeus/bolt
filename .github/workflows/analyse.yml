name: Analyse

on:
  push:
    paths:
      - '**.php'
      - 'demo/phpstan.neon'

jobs:
  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install composer dependencies
        working-directory: demo
        run: composer install

      - name: Run PHPStan
        run: composer analyse
